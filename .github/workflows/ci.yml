name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *' # Daily 02:23 Asia/Shanghai

permissions:
  contents: read

# Superseded PR commits share a group; main and manual runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      api: ${{ steps.select.outputs.api }}
      browser: ${{ steps.select.outputs.browser }}
      integration: ${{ steps.select.outputs.integration }}
      recovery: ${{ steps.select.outputs.recovery }}
      sandbox: ${{ steps.select.outputs.sandbox }}
      rollout: ${{ steps.select.outputs.rollout }}
      artifact: ${{ steps.select.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test selection and failure propagation
        run: node --test scripts/ci/*.test.mjs
      - name: Select required qualification
        id: select
        run: node scripts/ci/plan.mjs

  security:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject production dependency vulnerabilities
        run: pnpm security:audit
      - name: Scan production source for committed secrets
        run: pnpm security:scan

  backend:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify generated API contracts
        run: pnpm contracts:check
      - run: pnpm --filter slide-api typecheck
      - name: Verify qualification coverage
        run: pnpm qualification:matrix
      - name: Run tests when not covered by the full MySQL candidate
        if: needs.plan.outputs.api != 'true'
        run: pnpm --filter slide-api test

  frontend:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm --filter slide-frontend typecheck
      - name: Run tests
        run: pnpm --filter slide-frontend test
      - name: Build
        run: pnpm --filter slide-frontend build

  agent-core:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter agent-core typecheck
      - run: pnpm --filter agent-core test
      - name: Runtime deterministic qualification
        run: bash scripts/qualification/run-agent-runtime.sh --mode deterministic

  sandbox-controller:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter slide-sandbox-controller typecheck
      - run: pnpm --filter slide-sandbox-controller test

  browser:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter slide-frontend exec playwright install --with-deps chromium
      - run: pnpm --filter slide-frontend test:browser
      - name: Streaming reading and phase regression
        run: pnpm --filter slide-frontend exec playwright test streaming-render.spec.ts --config playwright.streaming.config.ts --grep 'real phases'

  browser-qualification:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qualification-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pqualification-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: qualification-test-password
      QUALIFICATION_ADMIN_PASSWORD: Tpam1234
      QUALIFICATION_CANCELLATION_E2E: '1'
      QUALIFICATION_CRON_E2E: '1'
      PLAYWRIGHT_MANAGED_ENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter slide-frontend exec playwright install --with-deps chromium
      - name: Login, authorization and persistent Agent cancellation
        run: >-
          pnpm --filter slide-frontend exec playwright test
          release-critical-paths.spec.ts release-security.spec.ts agent-cancellation.spec.ts
          --grep 'qualification login|qualification security boundary|viewer cannot|Stop cancels'
          --workers=1

      - name: Runtime MySQL transaction and WebSocket qualification
        run: bash scripts/qualification/run-agent-runtime.sh --mode mysql --runtime-only
      - name: Cron browser, real authenticated routes and durable completion
        run: pnpm --filter slide-frontend exec playwright test cron-live.spec.ts --workers=1
      - name: Runtime candidate isolation and history
        run: pnpm --filter slide-frontend exec playwright test agent-runtime.spec.ts --workers=1
      - name: Investigation workspace real SQL, JWT, HTTP, WS and browser acceptance
        env:
          T06_TEST_MYSQL_PORT: '3306'
          T06_TEST_MYSQL_PASSWORD: qualification-test-password
          T11_TEST_MYSQL_PORT: '3306'
          T11_TEST_MYSQL_PASSWORD: qualification-test-password
        run: pnpm --filter slide-frontend exec playwright test --config playwright.investigation.config.ts
      - name: Instance query states with live MySQL and permissions
        env:
          MAX163_TEST_MYSQL_PORT: ${{ env.DB_PORT }}
          MAX163_TEST_MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
        run: pnpm --filter slide-frontend exec playwright test --config playwright.instance-query.config.ts
      - name: Feedback evaluation and runtime qualification
        env:
          T11_TEST_MYSQL_PORT: '3306'
          T11_TEST_MYSQL_PASSWORD: qualification-test-password
          T06_TEST_MYSQL_PORT: '3306'
          T06_TEST_MYSQL_PASSWORD: qualification-test-password
        run: |
          pnpm --filter slide-api exec tsx --test ../../tests/qualification/investigation-eval.test.ts ../../tests/qualification/investigation-real-eval.test.ts ../../tests/qualification/investigation-quality.test.ts ../../tests/qualification/investigation-runtime.mysql.test.ts
      - name: Feedback SQL when not covered by the full MySQL candidate
        if: needs.plan.outputs.api != 'true'
        env:
          T11_TEST_MYSQL_PORT: '3306'
          T11_TEST_MYSQL_PASSWORD: qualification-test-password
        run: pnpm --filter slide-api exec vitest run src/investigations/feedback.mysql.test.ts src/investigations/feedback.production.mysql.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigation-qualification-${{ github.sha }}
          path: frontend/test-results-investigation/
          include-hidden-files: true
          retention-days: 30
      - name: Streaming real MySQL, WebSocket, Gateway, UI and refresh
        run: pnpm --filter slide-frontend exec playwright test --config playwright.streaming-live.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streaming-qualification-${{ github.sha }}
          path: frontend/test-results-streaming-live/
          include-hidden-files: true
          retention-days: 30

  recovery-qualification:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.recovery == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Empty database and repeat startup
        run: bash scripts/qualification/run-environment.sh bootstrap-upgrade
      - name: PostgreSQL credential collection and client release
        run: bash scripts/qualification/run-pg-collection.sh
      - name: Worker failover and fencing
        run: bash scripts/qualification/run-environment.sh failover
      - name: Startup lease, D1 readiness and Compose feature passthrough
        run: pnpm --filter slide-api exec tsx ../../tests/qualification/startup-readiness.test.ts
      - name: Report occurrence crashes and atomic notification outbox
        run: bash scripts/qualification/run-report-recovery.sh
      - name: Delegation ceilings and live grant revocation in isolated MySQL
        run: bash scripts/qualification/run-auth-boundary.sh
      - name: Analysis dispatch crashes, unknown billing windows and revoked authority
        run: bash scripts/qualification/run-analysis-recovery.sh
      - name: Database alert single ownership and legacy result bridges in isolated MySQL
        run: bash scripts/qualification/run-investigation-bridges.sh
      - name: Metrics retention through production workflow assembly and isolated MySQL
        run: bash scripts/qualification/run-metric-retention.sh
      - name: Bounded V23 source claims, lease loss and production formal publication
        run: bash scripts/qualification/run-v23-source.sh
      - name: Event lifecycle transactions, conflict and manual confirmation in isolated MySQL
        run: bash scripts/qualification/run-alert-event-transitions.sh
      - name: Instance removal, connection release and retry in isolated MySQL
        run: bash scripts/qualification/run-instance-removal.sh
      - name: Backup and restore
        run: bash scripts/qualification/run-environment.sh backup-restore
      - name: Concurrent workflow stability
        run: bash scripts/qualification/run-environment.sh stability

  # These modes each provision a disposable MySQL server and consume no artifacts
  # from the unit jobs. Keep serial test workers within each isolated server.
  investigation-api-qualification:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser for API suites with Chromium coverage
        run: pnpm --filter slide-frontend exec playwright install --with-deps chromium
      - name: Full API candidate against isolated MySQL
        run: T12_OUTPUT_DIR="$GITHUB_WORKSPACE/.qualification/t12/api-complete" bash scripts/qualification/run-investigation-rollout.sh --api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigation-api-${{ github.sha }}
          path: .qualification/t12/api-complete/
          include-hidden-files: true
          retention-days: 30

  investigation-rollout-qualification:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.rollout == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Investigation rollout, 10k duplicates and capacity
        run: bash scripts/qualification/run-investigation-rollout.sh --rollout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigation-rollout-${{ github.sha }}
          path: .qualification/t12/
          include-hidden-files: true
          retention-days: 30

  rootless-sandbox-qualification:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.sandbox == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real rootless controller, nonce MySQL and runtime security gate
        run: bash scripts/qualification/run-rootless-sandbox.sh --runtime-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootless-sandbox-${{ github.sha }}
          path: .qualification/rootless-sandbox/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  release-artifact:
    runs-on: ubuntu-latest
    needs: [plan, security, backend, frontend, agent-core, sandbox-controller, browser, browser-qualification, recovery-qualification, investigation-api-qualification, investigation-rollout-qualification, rootless-sandbox-qualification]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require all selected checks before packaging
        env:
          CI_SELECTION: ${{ needs.plan.outputs.selection }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-gate.mjs --checks-only
      - if: needs.plan.outputs.artifact == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build traceable release artifact
        if: needs.plan.outputs.artifact == 'true'
        run: pnpm release:artifact
      - name: Exercise atomic rollback
        if: needs.plan.outputs.artifact == 'true'
        run: pnpm release:rollback-drill "$(find .artifacts -name 'slide-*.tar.gz' -type f | head -1)"
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.artifact == 'true'
        with:
          name: slide-${{ github.sha }}
          path: |
            .artifacts/*.tar.gz
            .artifacts/*.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  ci-gate:
    runs-on: ubuntu-latest
    needs: [plan, security, backend, frontend, agent-core, sandbox-controller, browser, browser-qualification, recovery-qualification, investigation-api-qualification, investigation-rollout-qualification, rootless-sandbox-qualification, release-artifact]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate selected checks and release result
        env:
          CI_SELECTION: ${{ needs.plan.outputs.selection }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-gate.mjs
