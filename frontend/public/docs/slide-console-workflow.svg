<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Slide 控制台工作流</title><desc id="desc">从资源接入、仪表盘观察、告警处置、AI 分析、审批执行到报告复盘的控制台操作路径。</desc>
  <defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;fill:#14233a}.h{font-size:22px;font-weight:700}.l{font-size:17px;font-weight:700}.s{font-size:14px;fill:#52677e}.n{font-size:25px;font-weight:700;fill:#0f5f9d}.w{fill:#fff}.wl{fill:#dceeff}.line{fill:none;stroke:#6383a3;stroke-width:2.5}.box{stroke-width:1.5}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#6383a3"/></marker></defs>
  <rect width="1200" height="520" fill="#f7fafc"/><rect x="32" y="26" width="1136" height="54" rx="8" fill="#215c9b"/><text x="58" y="61" class="t h w">Slide 控制台推荐工作流</text><text x="1140" y="61" class="s wl" text-anchor="end">从接入到报告的可追溯操作路径</text>
  <path d="M226 260 H354" class="line" marker-end="url(#a)"/><path d="M426 260 H554" class="line" marker-end="url(#a)"/><path d="M626 260 H754" class="line" marker-end="url(#a)"/><path d="M826 260 H954" class="line" marker-end="url(#a)"/>
  <g><rect x="58" y="158" width="168" height="206" rx="9" fill="#e9f3fc" stroke="#76a6d0" class="box"/><text x="142" y="196" class="n" text-anchor="middle">01</text><text x="142" y="226" class="t l" text-anchor="middle">接入资源</text><text x="142" y="262" class="s" text-anchor="middle">数据库实例</text><text x="142" y="288" class="s" text-anchor="middle">服务器连接</text><text x="142" y="328" class="s" text-anchor="middle">测试连接并保存</text></g>
  <g><rect x="258" y="158" width="168" height="206" rx="9" fill="#eaf8f5" stroke="#65ab96" class="box"/><text x="342" y="196" class="n" text-anchor="middle">02</text><text x="342" y="226" class="t l" text-anchor="middle">观察健康</text><text x="342" y="262" class="s" text-anchor="middle">仪表盘总览</text><text x="342" y="288" class="s" text-anchor="middle">指标与容量趋势</text><text x="342" y="328" class="s" text-anchor="middle">TopSQL 与会话</text></g>
  <g><rect x="458" y="158" width="168" height="206" rx="9" fill="#fff5e7" stroke="#d89a44" class="box"/><text x="542" y="196" class="n" text-anchor="middle">03</text><text x="542" y="226" class="t l" text-anchor="middle">处置异常</text><text x="542" y="262" class="s" text-anchor="middle">告警筛选</text><text x="542" y="288" class="s" text-anchor="middle">事件调查</text><text x="542" y="328" class="s" text-anchor="middle">维护窗口 / 静默</text></g>
  <g><rect x="658" y="158" width="168" height="206" rx="9" fill="#f4edfb" stroke="#957cc8" class="box"/><text x="742" y="196" class="n" text-anchor="middle">04</text><text x="742" y="226" class="t l" text-anchor="middle">分析与决策</text><text x="742" y="262" class="s" text-anchor="middle">AI RCA / 诊断</text><text x="742" y="288" class="s" text-anchor="middle">执行计划</text><text x="742" y="328" class="s" text-anchor="middle">SQL 风险审核</text></g>
  <g><rect x="858" y="158" width="168" height="206" rx="9" fill="#fbecef" stroke="#d58a96" class="box"/><text x="942" y="196" class="n" text-anchor="middle">05</text><text x="942" y="226" class="t l" text-anchor="middle">执行与沉淀</text><text x="942" y="262" class="s" text-anchor="middle">审批与操作状态</text><text x="942" y="288" class="s" text-anchor="middle">恢复验证</text><text x="942" y="328" class="s" text-anchor="middle">报告与复盘</text></g>
  <rect x="58" y="412" width="968" height="42" rx="7" fill="#e7eef5"/><text x="542" y="439" class="s" text-anchor="middle">需要执行高风险变更时：先审核，再审批；完成后验证恢复，并将结果沉淀到事件、审计与报告中。</text>
</svg>
