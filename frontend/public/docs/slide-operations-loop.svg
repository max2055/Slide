<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Slide 运维闭环</title><desc id="desc">从资源接入和指标采集，到告警、事件、AI 分析、审批执行、验证和报告的循环流程。</desc>
  <defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;fill:#14233a}.h{font-size:22px;font-weight:700}.l{font-size:17px;font-weight:700}.s{font-size:14px;fill:#54687d}.k{font-size:13px;fill:#718196}.w{fill:#fff}.wl{fill:#d9f7ef}.line{fill:none;stroke:#5f7f9f;stroke-width:2.5}.box{stroke-width:1.5}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#5f7f9f"/></marker></defs>
  <rect width="1200" height="620" fill="#f7fafc"/><rect x="32" y="26" width="1136" height="54" rx="8" fill="#167b73"/><text x="58" y="61" class="t h w">Slide 数据库运维闭环</text><text x="1140" y="61" class="s wl" text-anchor="end">观测 · 分析 · 处置 · 验证 · 沉淀</text>
  <path d="M200 243 H330" class="line" marker-end="url(#a)"/><path d="M462 243 H592" class="line" marker-end="url(#a)"/><path d="M724 243 H854" class="line" marker-end="url(#a)"/><path d="M986 243 H1080 Q1120 243 1120 288 V380 Q1120 424 1076 424 H986" class="line" marker-end="url(#a)"/><path d="M854 424 H724" class="line" marker-end="url(#a)"/><path d="M592 424 H462" class="line" marker-end="url(#a)"/><path d="M330 424 H200 Q80 424 80 332 Q80 243 160 243 H200" class="line" marker-end="url(#a)"/>
  <g><rect x="68" y="170" width="132" height="146" rx="9" fill="#e8f2fb" stroke="#74a7d0" class="box"/><text x="134" y="208" class="t l" text-anchor="middle">1. 接入资源</text><text x="134" y="238" class="s" text-anchor="middle">数据库实例</text><text x="134" y="262" class="s" text-anchor="middle">SSH 服务器</text><text x="134" y="286" class="s" text-anchor="middle">指标注册表</text></g>
  <g><rect x="330" y="170" width="132" height="146" rx="9" fill="#e8f8f4" stroke="#5cae96" class="box"/><text x="396" y="208" class="t l" text-anchor="middle">2. 持续观测</text><text x="396" y="238" class="s" text-anchor="middle">指标采集</text><text x="396" y="262" class="s" text-anchor="middle">慢查询 / 容量</text><text x="396" y="286" class="s" text-anchor="middle">健康评分</text></g>
  <g><rect x="592" y="170" width="132" height="146" rx="9" fill="#fff5e6" stroke="#d89b46" class="box"/><text x="658" y="208" class="t l" text-anchor="middle">3. 发现异常</text><text x="658" y="238" class="s" text-anchor="middle">规则评估</text><text x="658" y="262" class="s" text-anchor="middle">告警 / 静默</text><text x="658" y="286" class="s" text-anchor="middle">维护窗口</text></g>
  <g><rect x="854" y="170" width="132" height="146" rx="9" fill="#f4edfb" stroke="#9278c8" class="box"/><text x="920" y="208" class="t l" text-anchor="middle">4. 调查分析</text><text x="920" y="238" class="s" text-anchor="middle">事件聚合</text><text x="920" y="262" class="s" text-anchor="middle">AI RCA / 诊断</text><text x="920" y="286" class="s" text-anchor="middle">TopSQL 分析</text></g>
  <g><rect x="854" y="350" width="132" height="146" rx="9" fill="#fcebed" stroke="#d88993" class="box"/><text x="920" y="388" class="t l" text-anchor="middle">5. 受控执行</text><text x="920" y="418" class="s" text-anchor="middle">SQL 审核</text><text x="920" y="442" class="s" text-anchor="middle">审批 / 重试</text><text x="920" y="466" class="s" text-anchor="middle">取消 / 回滚</text></g>
  <g><rect x="592" y="350" width="132" height="146" rx="9" fill="#eaf4fc" stroke="#6f9bc2" class="box"/><text x="658" y="388" class="t l" text-anchor="middle">6. 恢复验证</text><text x="658" y="418" class="s" text-anchor="middle">健康检查</text><text x="658" y="442" class="s" text-anchor="middle">指标回落</text><text x="658" y="466" class="s" text-anchor="middle">事件关闭</text></g>
  <g><rect x="330" y="350" width="132" height="146" rx="9" fill="#eff5e8" stroke="#91ab61" class="box"/><text x="396" y="388" class="t l" text-anchor="middle">7. 沉淀改进</text><text x="396" y="418" class="s" text-anchor="middle">审计轨迹</text><text x="396" y="442" class="s" text-anchor="middle">报告交付</text><text x="396" y="466" class="s" text-anchor="middle">复盘与规则优化</text></g>
  <rect x="68" y="538" width="1064" height="38" rx="7" fill="#e8eef4"/><text x="600" y="563" class="k" text-anchor="middle">每一步均保留可追溯记录：身份、资源范围、操作状态、事件时间线、审批结论与交付结果。</text>
</svg>
