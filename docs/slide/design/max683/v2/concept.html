<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide · 工作台设计 V2</title>
<style>
:root{--bg:#f8f9fa;--surface:#fff;--text:#3c3c43;--strong:#1a1a1e;--muted:#606068;--border:#e5e5ea;--accent:#265f99;--subtle:color-mix(in srgb,var(--accent) 6%,white);--danger:#b91c1c;--warn:#92400e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,a,summary{font:inherit}button{cursor:pointer}button:disabled{cursor:default}a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:5px;border-radius:3px}h1,h2,h3,p{margin:0}h1,h2,h3{color:var(--strong)}.shell{display:grid;grid-template-columns:168px minmax(0,1fr);min-height:100vh}.sidebar{padding:26px 16px;background:var(--surface);border-right:1px solid var(--border)}.brand{display:block;font-size:26px;line-height:1;font-weight:700;letter-spacing:-1px;color:var(--accent);margin:5px 12px 45px}.nav-label{font-size:11px;letter-spacing:1px;color:var(--muted);margin:28px 12px 10px}.nav-item{padding:10px 12px;margin:3px 0}.nav-item.active{background:var(--subtle);color:var(--accent);font-weight:600;border-radius:5px}.sidebar-footer{font-size:11px;color:var(--muted);margin:52px 12px 0}main{min-width:0;padding:0 48px 34px}.topline{height:58px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}.topline span:last-child{color:var(--accent)}.demo{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted);padding:10px 0}.demo a{white-space:nowrap}.heading{display:flex;align-items:center;justify-content:space-between;margin:22px 0 25px}h1{font-size:28px;line-height:1.35;letter-spacing:-.6px}.heading p{color:var(--muted);margin-top:6px}.muted{color:var(--muted)}.button,.business{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 16px;border:1px solid var(--border);border-radius:5px;white-space:nowrap;background:var(--surface);color:var(--accent);font-weight:600;font-size:13px}.button:hover{text-decoration:none;background:var(--subtle)}.business,.primary{background:var(--accent);border-color:var(--accent);color:white}.links{display:flex;gap:24px;font-size:13px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}.section-head h2{font-size:17px}.scope{font-size:12px;color:var(--muted);padding-bottom:14px}.scope small{font-size:11px}.scope details{display:inline-block;margin-left:12px}.scope summary{cursor:pointer;color:var(--accent)}.scope details[open]{display:block;margin:8px 0 0}.work-list{background:var(--surface);padding:0 26px;border-top:2px solid var(--accent)}.work{padding:22px 0;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:28px;border-bottom:1px solid var(--border);align-items:center}.work:last-child{border-bottom:0}.context{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin-bottom:7px}.status{color:var(--accent);font-weight:600}.status.failed{color:var(--danger)}.status.missing{color:var(--warn)}.work h3{font-size:20px;font-weight:600;line-height:1.45;letter-spacing:-.25px}.recommend{color:var(--accent);margin-top:7px;font-size:14px}.recommend span{font-size:12px;margin-right:8px}.metadata{color:var(--muted);font-size:11px;margin-top:10px;display:flex;gap:20px;flex-wrap:wrap}.row-action{justify-self:end}.list-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 0;color:var(--muted);font-size:11px}.quiet-button{border:0;background:none;color:var(--muted);font-size:12px}.scenario-nav{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);display:flex;gap:20px;flex-wrap:wrap;font-size:12px}.scenario-nav span{color:var(--muted)}.back{display:inline-block;margin:18px 0 20px;font-size:13px}.detail-eyebrow{font-size:12px;display:flex;gap:14px;color:var(--muted);margin-bottom:10px}.detail-title{font-size:30px;line-height:1.45;max-width:930px;letter-spacing:-.6px}.detail-object{font-size:12px;color:var(--muted);margin-top:8px}.decision{margin-top:22px;padding:19px 22px;background:var(--subtle);border-left:2px solid var(--accent);display:flex;gap:28px;align-items:center;justify-content:space-between}.decision-label{font-size:11px;color:var(--accent);margin-bottom:4px}.decision p{font-size:17px;color:var(--accent);font-weight:500;max-width:760px}.decision small{display:block;font-size:11px;color:var(--muted);margin-top:6px}.facts{display:grid;grid-template-columns:1.05fr 1fr 1.2fr;gap:28px;padding:22px 0;border-bottom:1px solid var(--border)}.facts dt{font-size:11px;color:var(--muted);margin-bottom:5px}.facts dd{margin:0;font-size:13px}.risk{font-size:13px;margin:14px 0 0;color:var(--text)}.risk span{font-size:11px;color:var(--warn);margin-right:10px}.detail-body{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:56px;margin-top:28px}.detail-body h2{font-size:16px;margin-bottom:12px}.basis{background:var(--surface);padding:18px 22px}.basis p{font-size:13px;line-height:1.8;margin:6px 0}.basis small{font-size:11px;color:var(--muted)}.conditions{font-size:13px;margin-top:20px}.conditions p{margin:7px 0}.progress p{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:12px}.progress p span{color:var(--muted)}.raw{margin-top:22px;border-top:1px solid var(--border);padding-top:14px;font-size:12px}.raw summary{color:var(--accent);cursor:pointer}.raw p{margin-top:10px;line-height:1.9}.catalog-row{display:grid;grid-template-columns:minmax(0,1fr) 155px 130px;gap:24px;padding:24px 0;border-bottom:1px solid var(--border);align-items:center}.catalog-row h3{font-size:17px}.catalog-row p{font-size:12px;color:var(--muted);margin-top:5px}.catalog-row .time{font-size:12px;color:var(--muted)}.empty{padding:75px 0}.empty p{margin:12px 0 22px}@media(min-width:1700px){main{padding-left:72px;padding-right:72px}.work{padding:27px 0}}@media(max-width:1380px){main{padding-left:32px;padding-right:32px}.detail-title{font-size:28px}.detail-body{gap:32px}.work{padding:18px 0}.decision p{font-size:16px}}
</style>
</head>
<body>
<div class="shell"><aside class="sidebar"><b class="brand">Slide</b><p class="nav-label">AI 工作空间</p><p class="nav-item active">AI 工作台</p><p class="nav-item">运维对话</p><p class="nav-label">基础设施</p><p class="nav-item">资源管理</p><p class="nav-item">事件中心</p><p class="nav-item">审批中心</p><p class="sidebar-footer">导航位置示意</p></aside>
<main><div class="topline"><span>AI 工作空间 / 工作台</span><span>设计提案 V2 · 供确认</span></div><div class="demo"><span>演示数据 · 未连接 API；业务操作禁用；筛选、分页及返回上下文/焦点恢复尚未实现。</span><a href="compare.html">与上一版对照 ↗</a></div><div id="content"></div><nav class="scenario-nav" aria-label="设计状态示例"><span>状态示例</span><a href="?">首页</a><a href="?view=detail">待审批</a><a href="?view=detail&mode=failed">验证失败</a><a href="?view=detail&mode=missing">证据不足</a><a href="?view=detail&mode=continue">可继续调查</a><a href="?view=detail&mode=running">运行中调查</a><a href="?view=empty">空状态</a><a href="?view=empty&mode=forbidden">无权限</a></nav></main></div>
<script>
const q=new URLSearchParams(location.search),view=q.get('view')||'home',mode=q.get('mode')||'approval';
const data={
 approval:{status:'待独立审批',type:'行动计划详情',object:'专用演练服务重启计划 · 来源调查 A',conclusion:'计划尚未批准，业务恢复仍未确认。',advice:'先审阅目标、影响与有效期，再进入独立审批。',cta:'进入独立审批',evidence:'当前计划 v3 尚未获得独立批准；批准后仍须显式确认执行。',detail:'示例：已有服务状态与 HTTP 样本，但故障原因尚未确认。',risk:'重启会造成专用服务短时中断；执行前须核对目标配置和恢复条件。',phase:['原因未确认','等待独立审批','未发送','未开始']},
 failed:{status:'验证失败',type:'行动恢复验证详情',object:'专用服务恢复验证报告 · 来源调查 B',conclusion:'执行已成功，但恢复验证未通过。',advice:'先核对失败样本与观察窗口，再判断后续处置；不要重复执行。',cta:'查看失败证据',evidence:'reason：观察窗口内出现 HTTP 失败；missingSamples：0。',detail:'observedFrom：2026-11-16 15:30；observedUntil：15:35（北京时间）。报告引用：执行 E1 / 报告 v2。',risk:'当前不能确认业务恢复；本次执行成功不代表恢复条件满足。',phase:['原因未确认','当前执行所用版本','成功','失败']},
 missing:{status:'证据不足',type:'行动恢复验证详情',object:'恢复采样验证报告 · 来源调查 C',conclusion:'采样不足，无法判断业务是否恢复。',advice:'先核对缺失的 12 个样本与采样链路，补齐证据后再判断恢复。',cta:'核对缺失证据',evidence:'reason：观察样本不足；missingSamples：12。缺样不能按正常样本处理。',detail:'observedFrom：2026-11-16 15:30；observedUntil：15:35（北京时间）。报告引用：执行 E1 / 报告 v2。',risk:'恢复结论为未知；保留原动作，不因缺样重复执行。',phase:['原因未确认','当前执行所用版本','成功','证据不足']},
 continue:{status:'需继续调查',type:'调查详情',object:'服务间歇性不可用调查',conclusion:'故障原因未确认，现有证据不足。',advice:'补充不同时段的状态和访问样本，再继续原调查。',cta:'继续原调查',evidence:'现有 HTTP 样本不足以判断间歇性故障的原因。',detail:'当前无活动请求；核对目标与已有证据后补充信息。',risk:'业务恢复未确认；补证据后再作处置判断。',phase:['无活动请求','业务恢复未确认']},
 running:{status:'调查运行中',type:'调查详情',object:'数据库连接异常调查 R',conclusion:'调查请求运行中，故障原因尚未确认。',advice:'读取当前请求进展，等待结果返回后再判断下一步。',cta:'读取当前请求',evidence:'当前采样请求正在运行，新的调查结果尚未生成。',detail:'有活动请求；不重复派发。运行结束也不等于业务恢复。',risk:'业务恢复尚未确认；当前仅查看原请求。',phase:['活动请求运行中','业务恢复未确认']},
 second:{status:'待独立审批',type:'行动计划详情',object:'A2 · 专用服务配置核对计划 · 来源调查 A',conclusion:'配置核对计划尚未批准。',advice:'审阅第二个计划的核对范围与前置条件，再进入独立审批。',cta:'进入独立审批',evidence:'这是调查 A 的第二个待审批计划，由完整行动列表发现，不是首页投影的第二行。',detail:'计划更新 15:46；调查更新时间仍为 15:20，两者不混用。',risk:'须核对当前计划具体范围；不沿用 A1 的审批或绑定。',phase:['原因未确认','等待独立审批','未发送','未开始']},
 history:{status:'已过期 · 历史只读',type:'行动计划详情',object:'H1 · 历史服务处置计划 · 来源调查 H（已关闭）',conclusion:'计划已过期，仅可读取历史记录。',advice:'核对历史版本与证据；不要沿用过期计划审批或执行。',cta:'历史只读',evidence:'已关闭调查 H 不进入首页下一步投影，授权历史计划仍可从完整行动列表发现。',detail:'计划更新时间：未提供。',risk:'历史记录不提供新的执行资格。',phase:['已关闭','已过期','历史记录','按历史报告读取']}
};
const homeRows=[
 {key:'approval',origin:'专用服务不可用调查 A',target:'测试服务器 / slide-demo.service',time:'15:20',cta:'审阅计划'},
 {key:'failed',origin:'专用服务恢复调查 B',target:'测试服务器 / slide-demo.service',time:'15:38',cta:'查看失败证据'},
 {key:'missing',origin:'服务采样缺口调查 C',target:'测试服务器 / slide-demo.service',time:'15:31',cta:'核对缺失证据'},
 {key:'continue',origin:'服务间歇性不可用调查',target:'测试服务器',time:'15:20',cta:'查看调查'}
];
const nav=`<div class="links"><a href="?view=investigations">完整调查列表 →</a><a href="?view=actions">完整行动列表 →</a></div>`;
const status=(d,key)=>`<span class="status ${key}">${d.status}</span>`;
const content=document.getElementById('content');
if(view==='home'){
 content.innerHTML=`<header class="heading"><div><h1>AI 工作台</h1><p>先看结论，再决定下一步。</p></div>${nav}</header><div class="section-head"><h2>需要处理</h2><span class="muted" style="font-size:12px">已加载 4 个调查的下一步 · 非全部计划</span></div><div class="scope">每调查一个当前下一步 · 仅 open/waiting 调查<details><summary>覆盖说明</summary><p>优先选择一个执行，否则选择一个计划。翻完页也不覆盖同调查其他计划或已关闭调查历史；请使用完整类型列表按授权逐页发现。不支持全域排序、统计或等待时长。</p></details></div><section class="work-list" aria-label="每调查一个当前下一步">${homeRows.map(r=>{const d=data[r.key];return `<article class="work"><div><div class="context">${status(d,r.key)}<span>来源调查：${r.origin}</span></div><h3>${d.conclusion}</h3><p class="recommend"><span>建议</span>${d.advice}</p><div class="metadata"><span>目标：${r.target}</span><span>调查更新时间：今日 ${r.time} · 北京时间</span></div></div><a class="button row-action" href="?view=detail&mode=${r.key}">${r.cta} →</a></article>`}).join('')}</section><div class="list-foot"><span>演示顺序，不代表全域优先级。目标、结论与建议摘要仍需最小只读摘要契约确认。</span><button class="quiet-button" disabled>加载更多（示意）</button></div>`;
}else if(view==='detail'){
 const key=data[mode]?mode:'approval',d=data[key],investigation=['continue','running'].includes(key);
 const facts=investigation?`<div><dt>目标</dt><dd>测试服务器</dd></div><div><dt>当前请求</dt><dd>${key==='continue'?'无活动请求，可继续':'活动请求运行中，不再派发'}</dd></div><div><dt>调查更新时间（北京时间）</dt><dd>今日 ${key==='continue'?'15:20':'15:25'}</dd></div>`:`<div><dt>目标</dt><dd>测试服务器 / slide-demo.service</dd></div><div><dt>${key==='second'?'核对范围':'影响'}</dt><dd>${key==='second'?'当前服务配置与计划前置条件':'专用服务短时中断'}</dd></div><div><dt>计划有效期（北京时间）</dt><dd>2026-11-16 15:40 — 16:10${key==='history'?' · 已过期':''}</dd></div>`;
 const conditions=investigation?'<p>以原调查与结果版本读取证据；补充信息后才显式发起请求。</p>':'<p>前置条件：目标配置、服务单元及工具版本与当前计划一致。</p><p>验证条件：基线 120 秒，后观察 300 秒，每 10 秒采样。</p><p>回滚能力：核对当前计划 capability 与 description 原文。</p>';
 content.innerHTML=`<a class="back" href="?">← 返回需要处理</a><div class="detail-eyebrow"><span>${d.type}</span>${status(d,key)}</div><h1 class="detail-title">${d.conclusion}</h1><p class="detail-object">${d.object}</p><section class="decision" aria-label="建议与主操作"><div><div class="decision-label">建议下一步</div><p>${d.advice}</p><small>${investigation?'演示按钮禁用，不发起调查请求。':key==='approval'||key==='second'?'独立审批后仍须显式确认执行；原作者不可自批。':'仅查看原记录，不重新发送原动作。'}</small></div><button class="business" disabled>${d.cta}（演示）</button></section><dl class="facts">${facts}</dl><p class="risk"><span>风险与判断边界</span>${d.risk}</p><div class="detail-body"><section><h2>决策依据</h2><div class="basis"><p>${d.evidence}</p><p>${d.detail}</p><small>演示证据，须按调查、计划/执行及报告版本绑定读取。</small></div><div class="conditions"><h2>${investigation?'继续判断前':'验证与处置条件'}</h2>${conditions}</div><details class="raw"><summary>展开完整证据、版本与原始资料</summary><p>${investigation?'此处为调查资料占位：按调查与结果版本读取原始样本、证据引用和原请求记录。不能将当前请求运行结束推断为业务恢复。':'此处为行动资料占位：保留计划 v3、完整参数、内容哈希、工具版本、审批记录及当前执行/报告引用。正式决策前须完整可读，不引用上一轮报告。'}原型没有实际原始报告或业务数据。</p></details></section><aside class="progress"><h2>${investigation?'调查进展':'流程进展'}</h2>${d.phase.map((s,i)=>`<p><span>${investigation?['请求','业务状态'][i]:['调查','计划','执行','恢复验证'][i]}</span>${s}</p>`).join('')}<p><span>数据范围</span>仅演示</p></aside></div>`;
}else if(['actions','investigations'].includes(view)){
 const actions=view==='actions';
 const rows=actions?[
 ['A1 · 专用演练服务重启计划','调查 A · 待审批，首页选中的当前下一步','计划更新 15:42','approval','审阅 A1'],
 ['A2 · 专用服务配置核对计划','同一调查 A · 第二个待审批计划，首页不逐条覆盖','计划更新 15:46','second','审阅 A2'],
 ['H1 · 历史服务处置计划','已关闭调查 H · 已过期，按授权只读发现','未提供','history','读取历史']
 ]:[
 ['服务间歇性不可用调查','无活动请求 · 补充证据后继续','调查更新 15:20','continue','查看可继续调查'],
 ['数据库连接异常调查 R','活动请求运行中 · 只读当前进展','调查更新 15:25','running','查看运行中调查'],
 ['已关闭调查 H','授权历史计划 H1 经完整行动列表发现','调查更新 14:00','catalog','查看授权行动']
 ];
 content.innerHTML=`<a class="back" href="?">← 返回需要处理</a><header class="heading"><div><h1>完整${actions?'行动':'调查'}列表</h1><p>授权范围内逐页发现，不受首页下一步投影限制。</p></div>${nav}</header><p class="scope">无状态过滤的演示；各类型独立分页。“完整”指可逐页发现，不表示已加载全量或全域统计。</p><section class="work-list">${rows.map(r=>`<article class="catalog-row"><div><h3>${r[0]}</h3><p>${r[1]}</p></div><span class="time">${r[2]}</span><a href="${r[3]==='catalog'?'?view=actions':'?view=detail&mode='+r[3]}">${r[4]} →</a></article>`).join('')}</section><p class="scope" style="margin-top:15px">实际列表保留 nextCursor / partial / countScope。仅行动权限用户直接降级行动列表，不加载或显示调查摘要；这里是双权限演示。</p>`;
}else{
 content.innerHTML=`<div class="empty"><h1>${mode==='forbidden'?'当前内容不可访问':'当前页没有需要处理的事项'}</h1><p>${mode==='forbidden'?'不展示记录、目标或数量。请核对登录状态与相应读取权限。':'仅覆盖当前授权与已读取范围；如有下一页须继续读取，不能推断全局无待办。'}</p><a href="?">返回需要处理 →</a></div>`;
}
</script>
</body></html>
