<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>工作台 V3 · 同尺寸对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8f9fa;color:#3c3c43;font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;padding:28px}h1{font-size:24px;margin:12px 0}a{color:#265f99}nav{display:flex;gap:12px;margin:22px 0}button{font:inherit;padding:8px 18px;border:1px solid #d1d1d6;border-radius:4px;background:white;cursor:pointer}button[aria-pressed=true]{background:#265f99;color:white}button:focus-visible,a:focus-visible{outline:2px solid #265f99;outline-offset:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:22px}img{width:100%;height:auto;display:block}figure{margin:0}figcaption{padding:10px 0;font-size:13px}p{color:#606068}#reason{font-size:16px;color:#265f99;margin-bottom:22px}</style>
<a href="concept.html">← 返回新版可点击原型</a><h1>先读结论，再读建议。</h1><p>四组均为 1440 × 900、同一浏览器与演示状态。点击图像查看原始尺寸；左图基于 cae5297c (V2)，右图为 V3。</p><nav aria-label="对照状态"></nav><p id="reason"></p><div class="pair"><figure><figcaption>上一版 · cae5297c (V2)</figcaption><a id="oldlink"><img id="old" alt="上一版状态截图"></a></figure><figure><figcaption>新版 · 对象上下文与可溯源决策</figcaption><a id="newlink"><img id="new" alt="新版状态截图"></a></figure></div><p>比较的是静态设计。API、权限、分页筛选及导航上下文恢复未实现；业务按钮禁用。</p>
<script>
const states=[['home','首页','从平铺句子提升为对象上下文、结论、就近依据、建议与主入口。'],['detail','计划详情','完整详情增加对象上下文栏，结论旁边保留证据引用，建议与操作在相邻区域。'],['failed','验证失败','把执行成功但验证未通过写完整，紧接核对失败样本建议，避免误读为恢复。'],['missing','证据不足','先明确恢复情况未知，再具体建议核对 12 个缺失样本及采样链路。']];
const nav=document.querySelector('nav');
for(const [key,label,reason] of states){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('reason').textContent=reason;for(const [id,prefix] of [['old','before-'],['new','']]){const src=prefix+key+'-1440.png';document.getElementById(id).src=src;document.getElementById(id+'link').href=src;}};b.setAttribute('aria-pressed','false');nav.appendChild(b);}nav.firstChild.click();
</script></html>
