 content.innerHTML=`<a class="back" href="?">← 返回需要处理</a><div class="record-shell"><aside class="object-context"><h2>对象上下文</h2>${status(d,key)}<p class="context-object">${sourceObject}</p><dl><dt>目标</dt><dd>测试服务器${investigation?'':' / slide-demo.service'}</dd>${contextFacts}</dl><div class="record-progress">${d.phase.map((s,i)=>`<p><span>${investigation?['请求','业务状态'][i]:['调查','计划','执行','恢复验证'][i]}</span>${s}</p>`).join('')}</div></aside><section class="record-main"><div class="detail-eyebrow">${d.type} / 当前结论</div><h1 class="detail-title">${d.conclusion}</h1><p class="risk"><span>风险与判断边界</span>${d.risk}</p><div class="decision-grid"><section class="evidence-pane" id="evidence"><h2>结论依据 <span class="refnum">[1]</span></h2><p>${d.evidence}</p><p class="row-evidence">${d.detail}</p><table class="evidence-table"><thead><tr><th>引用</th><th>来源</th><th>支持内容 / 限制</th></tr></thead><tbody>${evidenceRows}</tbody></table></section><section class="next-pane"><h2>建议下一步</h2><p>${d.advice}</p><button class="business" disabled>${d.cta}（演示）</button><small>${investigation?'演示按钮禁用，不发起调查请求。':key==='approval'||key==='second'?'独立审批后仍须显式确认执行；原作者不可自批。':'仅查看原记录，不重新发送原动作。'}</small></section></div><div class="conditions"><h2>${investigation?'继续判断前':'验证与处置条件'}</h2>${conditions}</div><details class="raw"><summary>展开完整证据、版本与原始资料</summary><p>${investigation?'此处为调查资料占位：按调查与结果版本读取原始样本、证据引用和原请求记录。不能将当前请求运行结束推断为业务恢复。':'此处为行动资料占位：保留计划版本、完整参数、内容哈希、工具版本、审批记录及当前执行/报告引用。正式决策前须完整可读，不引用上一轮报告。'}原型没有实际原始报告或业务数据。</p></details></section></div>`;
