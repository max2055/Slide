`}</div><div class="composer"><textarea aria-label="继续调查" placeholder=${this.running?"本次执行中，可观察或取消；结束后可继续追问":t?"继续这个调查，例如：核对最新采集失败记录…":this.isNetwork?"继续这个调查，例如：检查 SNMP 可达性…":this.isServer?"继续这个调查，例如：查看新的磁盘趋势…":"继续这个调查，例如：检查最近 24 小时的慢 SQL…"} .disabled=${this.running} id="followup"></textarea><div><span>${h("lock")}仅使用已授权的只读工具</span>${this.running?s`<button class="btn" @click=${()=>this.modal="cancel"}>取消本次执行</button>`:s`<button class="btn-primary" @click=${()=>{this.querySelector("#followup").value.trim()?this.start():this.notice="请输入继续调查的目标，或使用上方“继续收集证据”。"}}>继续调查 ${h("arrow-up")}</button>`}</div></div></section>
<aside class="context ${this.mobileContext?"mobile-open":""}"><div class="context-heading"><h2>调查上下文</h2><span>实时关联</span></div><div class="context-tabs">${[["evidence","证据"],["hypotheses","假设"],["result","结论"]].map(([r,n])=>s`<button class="btn-ghost ${this.tab===r?"selected":""}" @click=${()=>this.tab=r}>${n}</button>`)}</div><div class="context-body">${this.tab==="evidence"?this.evidence(t):this.tab==="hypotheses"?this.hypotheses(t):this.result(t)}<div class="context-section"><h4>关联资源</h4><button class="resource-link" @click=${()=>this.go("resource")}>${h(t?"cpu":"database")}<span>${e.resource}<small>${t?"平台组件":"生产环境 · 有读取权限"}</small></span>${h("arrow-up-right")}</button></div><div class="context-section"><h4>触发上下文</h4><dl><dt>来源</dt><dd>${e.source}</dd><dt>聚合事件</dt><dd>${e.events} 条 <button class="btn-ghost link" @click=${()=>this.go("events")}>查看</button></dd><dt>发生窗口</dt><dd>17:45–18:05 CST</dd><dt>执行身份</dt><dd>受限诊断主体</dd><dt>预算</dt><dd>120 秒 / 20 次工具</dd></dl></div></div></aside></div>`}stateControls(){return s`<div class="state-controls"><span>评审状态</span><select aria-label="评审状态" .value=${this.stateDemo} @change=${e=>this.stateDemo=e.target.value}>${["正常","连接中断","结果未知","权限不足","加载中"].map(e=>s`<option>${e}</option>`)}</select></div>`}exceptionState(){const e={连接中断:["实时连接已断开","后台执行不受影响。重连后从已保存的事件继续展示。","重新连接"],结果未知:["本次执行结果未知","模型请求已发出，但完成状态未确认。不会自动重复付费调用。","人工确认后重新调查"],权限不足:["你无权查看此调查内容","关联资源的读取权限已被撤销，证据与摘要同时隐藏。","返回关注事项"]};if(this.stateDemo==="加载中")return s`<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div>`;const[t,i,r]=e[this.stateDemo];return s`<app-empty-state title=${t} description=${i}><button slot="actions" class="btn" @click=${()=>{this.stateDemo==="权限不足"?this.go("home"):this.stateDemo==="结果未知"?(this.stateDemo="正常",this.start()):this.stateDemo="正常"}}>${r}</button></app-empty-state>`}evidence(e){return s`<h4 class="subheading">证据快照 <span>3</span></h4>${(e?[["E01","任务执行记录","6 次失败 / 相同错误码","good"],["E02","请求关联记录","correlation ID 已匹配","good"],["E03","源码版本","部署版本快照缺失","gap"]]:this.isNetwork?[["E01","采集失败记录","连续 8 次未返回数据","good"],["E02","设备配置元信息","目标与凭据引用存在","good"],["E03","SNMP 可达性","尚未确认设备响应","gap"]]:this.isServer?[["E01","磁盘趋势","使用率峰值 91%","good"],["E02","人工处理记录","已清理过期日志","good"],["E03","恢复验证","15 分钟低于阈值","good"]]:[["E01","CPU 与吞吐量","CPU 92% · QPS +3%","good"],["E02","慢 SQL 统计","扫描行数增长 8.4 倍","good"],["E03","执行计划","尚未采集，无法核实索引","gap"]]).map(([t,i,r,n])=>s`<button class="evidence-item" @click=${()=>this.modal=t}><div><span class="evidence-id">${t}</span>${m(n==="good"?"已获取":"缺失",n==="good"?"ok":"warn")}</div><strong>${i}</strong><span>${r}</span><small>${n==="good"?"采集 18:06 · 查看来源与时间窗口":"补充后才可用于判断"}</small></button>`)}${!e&&!this.isNetwork&&!this.isServer?s`<div class="mini-chart"><div><b>CPU 使用率</b><span>92%</span></div>${this.chart()}<div class="chart-label"><span>17:45</span><span>18:05</span></div><small>演示数据 · 阈值 80%</small></div>`:c}`}chart(){return s`<svg viewBox="0 0 400 110" class="chart" role="img" aria-label="演示 CPU 曲线从 30% 升至 92%"><path d="M0 90H400M0 50H400M0 10H400" fill="none" stroke="var(--border)"/><path d="M0 28H400" fill="none" stroke="var(--warn)" stroke-dasharray="5 5"/><path d="M0 85L25 81L50 86L75 78L100 82L125 75L150 70L175 74L200 58L225 35L250 42L275 19L300 24L325 13L350 17L375 9L400 12" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>`}hypotheses(e){return s`<h4 class="subheading">候选原因</h4>${(e?[["部署配置异常","待验证","缺少完整的配置变更记录"],["源码缺陷","证据不足","没有匹配 Commit 的源码快照"]]:this.isNetwork?[["网络链路不可达","待验证","支持：E01 采集失败；缺口：E03"],["凭据过期","证据不足","仅元信息存在，不代表认证成功"]]:this.isServer?[["日志保留策略失效","待验证","日志增长已观察，保留策略待人工核对"]]:[["SQL 执行路径退化","待验证","支持：E02 扫描量增大；缺口：E03"],["业务流量增长","暂不支持","反面：E01 QPS 仅增加 3%"],["锁竞争","暂不支持","反面：工具未发现显著锁等待"]]).map(([t,i,r])=>s`<div class="hypothesis"><strong>${t}</strong>${m(i,i==="待验证"?"warn":"muted")}<p>${r}</p></div>`)}<p class="small">“引用已绑定”表示来源可追溯，不代表因果关系已证实。</p>`}result(e){return s`<h4 class="subheading">调查结论 · 版本 ${this.runCount}</h4>${m("根因尚未验证","warn")}<h3>${e?"证据不足，保留开放调查":this.isNetwork?"采集缺失已确认，设备状态待核实":this.isServer?"人工处理后恢复已验证":"SQL 扫描量异常是优先验证方向"}</h3><p>已确认事实、候选原因与处理结果分别记录。</p><div class="rule-line"><span>本次执行</span><b>${this.running?"进行中":"已结束"}</b></div><div class="rule-line"><span>根因验证</span><b>待验证</b></div><div class="rule-line"><span>业务恢复</span><b>${this.current.status==="已关闭"?"已验证":"未确认"}</b></div><button class="btn full" @click=${()=>this.modal="feedback"}>反馈结论准确性</button><button class="btn-ghost full" @click=${()=>this.modal="close"}>记录处理与验证结果</button>`}chat(){return s`<section class="chat-page"><div class="chat-top"><h2>普通对话</h2><button class="btn" @click=${()=>this.modal="convert"}>转为调查 ${h("arrow-up-right")}</button></div><div class="chat-body"><span class="big-agent">${h("sparkles")}</span><h1>从一个问题开始。</h1><p>解释概念、讨论思路，或把需要跟踪的问题转为调查。</p>${this.chatMessages.length?this.chatMessages.map((e,t)=>s`<div class="chat-message ${t%2?"answer":"question"}"><strong>${t%2?"Slide 助手":"你"}</strong><p>${e}</p></div>`):s`<div class="suggestions">${["解释 InnoDB Buffer Pool","如何分析数据库 CPU 异常？","锁等待与慢 SQL 有什么关系？"].map(e=>s`<button class="btn" @click=${()=>this.ask(e)}>${e}${h("arrow-up-right")}</button>`)}</div>`}</div><div class="composer chat-composer"><textarea id="question" aria-label="普通对话内容" placeholder="直接提问，无需创建调查…"></textarea><div><span>普通对话 · 不自动调用生产工具</span><button class="btn-primary" @click=${()=>{const e=this.querySelector("#question").value.trim();e&&(this.ask(e),this.querySelector("#question").value="")}}>发送 ${h("arrow-up")}</button></div></div></section>`}ask(e){this.chatMessages=[...this.chatMessages,e,e.includes("Buffer")?"InnoDB Buffer Pool 是用于缓存数据页和索引页的内存区域。它减少磁盘读取；分析命中率时还应结合工作集、物理读与内存压力。":"这类问题适合先确认异常时间窗口，再检查吞吐量、慢 SQL、锁等待和执行计划。以上是原型示例回答；需要资源证据时，可将本对话转为调查。"]}resource(){return this.current.agent==="System Agent"||this.isNetwork||this.isServer?this.otherResource():s`<section class="page">${this.heading("mysql-orders-prod","资源中心 / 数据库实例 / MySQL 8.0",!1)}<div class="resource-toolbar">${m("运行中","ok")}${m("存在严重告警","danger")}<span>生产环境 · 订单业务 · 有读取权限</span><button class="btn-primary" @click=${()=>{this.modal="new",this.notice="已带入资源 mysql-orders-prod 与时间范围 17:45–18:05。"}}>针对当前时段调查</button></div><div class="resource-layout"><app-card><span slot="header">CPU 使用率</span><div class="metric-number">92<small>%</small></div>${this.chart()}<div class="chart-label"><span>17:45</span><span>18:05</span></div></app-card><app-card><span slot="header">关联 AI 调查</span>${m("等待处理","warn")}<h2>订单库 CPU 持续升高</h2><p>慢 SQL 扫描量异常，执行计划待验证。</p><p class="small">INV-1042 · 已聚合 12 个事件</p><button class="btn" @click=${()=>this.openItem("INV-1042")}>打开已有调查 ${h("arrow-right")}</button></app-card></div><div class="info-banner">业务页面与 AI 工作空间引用同一调查。相同事件不会再次启动重复分析。</div><app-card><span slot="header">资源关联</span><div class="relations"><span>${h("database")}mysql-orders-prod</span><span>运行于 →</span><span>${h("server")}db-host-01</span><span>连接至 →</span><span>${h("network")}core-switch-02</span></div><p class="small">关系来自已维护的资源信息。V1 只使用已有关系，不自动推断拓扑。</p></app-card></section>`}otherResource(){const e=this.current;return s`<section class="page">${this.heading(e.resource,e.agent==="System Agent"?"平台组件 / 运行上下文":"资源中心 / 资源详情",!1)}<div class="resource-layout"><app-card><span slot="header">资源上下文</span><h2>${e.resource}</h2><dl><dt>类型</dt><dd>${e.source}</dd><dt>关联事件</dt><dd>${e.events} 条</dd><dt>观测质量</dt><dd>${this.isServer?"恢复已验证":"存在证据缺口"}</dd></dl><p>资源观测与调查状态分别记录，数据缺失不会被当作正常。</p></app-card><app-card><span slot="header">已有调查</span>${m(e.status,"info")}<h2>${e.title}</h2><p>${e.summary}</p><button class="btn" @click=${()=>this.openItem(e.id)}>打开已有调查</button></app-card></div></section>`}events(){return s`<section class="page">${this.heading("事件中心","原始事实保留，重复异常聚合。同一个问题拥有连续的调查上下文。",!1)}<div class="info-banner">29 个事件 → 4 项调查。原始告警仍可独立确认与关闭，调查状态不会代替告警恢复状态。</div><div class="event-list">${this.items.map(e=>s`<app-card><div class="event-row"><span class="event-count">${e.events}<small>条事件<
